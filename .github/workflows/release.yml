name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag (defaults to latest, or beta for prereleases)
        required: false
        type: string
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24

      - name: Validate version
        id: version
        run: |
          node -e "
            const versions = [
              require('./package.json').version,
              require('./packages/react/package.json').version,
              require('./packages/vue/package.json').version,
              require('./packages/svelte/package.json').version,
              require('./packages/solid/package.json').version,
            ];
            const releaseVersion = process.env.GITHUB_EVENT_NAME === 'release'
              ? process.env.GITHUB_REF_NAME.replace(/^v/, '')
              : versions[0];
            if (versions.some((version) => version !== releaseVersion)) {
              throw new Error('Package versions must match release ' + process.env.GITHUB_REF_NAME + ': ' + versions.join(', '));
            }
            const requestedTag = process.env.NPM_TAG.trim();
            const npmTag = requestedTag || (releaseVersion.includes('-') ? 'beta' : 'latest');
            if (!/^[a-zA-Z0-9_][a-zA-Z0-9._-]*$/.test(npmTag)) {
              throw new Error('Invalid npm dist-tag: ' + npmTag);
            }
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + releaseVersion + '\n');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + npmTag + '\n');
          "
        env:
          NPM_TAG: ${{ inputs.tag || '' }}

      - name: Build packages
        run: pnpm build

      - name: Pack packages
        run: |
          mkdir packages-to-publish
          pnpm pack --pack-destination packages-to-publish
          pnpm --dir packages/react pack --pack-destination "$GITHUB_WORKSPACE/packages-to-publish"
          pnpm --dir packages/vue pack --pack-destination "$GITHUB_WORKSPACE/packages-to-publish"
          pnpm --dir packages/svelte pack --pack-destination "$GITHUB_WORKSPACE/packages-to-publish"
          pnpm --dir packages/solid pack --pack-destination "$GITHUB_WORKSPACE/packages-to-publish"

      - name: Publish core package
        run: pnpm publish "$GITHUB_WORKSPACE/packages-to-publish/oreui-web-${{ steps.version.outputs.value }}.tgz" --access public --provenance --no-git-checks --ignore-scripts --tag "${{ steps.version.outputs.tag }}"

      - name: Publish React package
        run: pnpm publish "$GITHUB_WORKSPACE/packages-to-publish/oreui-web-react-${{ steps.version.outputs.value }}.tgz" --access public --provenance --no-git-checks --ignore-scripts --tag "${{ steps.version.outputs.tag }}"

      - name: Publish Vue package
        run: pnpm publish "$GITHUB_WORKSPACE/packages-to-publish/oreui-web-vue-${{ steps.version.outputs.value }}.tgz" --access public --provenance --no-git-checks --ignore-scripts --tag "${{ steps.version.outputs.tag }}"

      - name: Publish Svelte package
        run: pnpm publish "$GITHUB_WORKSPACE/packages-to-publish/oreui-web-svelte-${{ steps.version.outputs.value }}.tgz" --access public --provenance --no-git-checks --ignore-scripts --tag "${{ steps.version.outputs.tag }}"

      - name: Publish Solid package
        run: pnpm publish "$GITHUB_WORKSPACE/packages-to-publish/oreui-web-solid-${{ steps.version.outputs.value }}.tgz" --access public --provenance --no-git-checks --ignore-scripts --tag "${{ steps.version.outputs.tag }}"
